# Kubelet CredentialProviderConfig. On k3s, put this at
# /var/lib/rancher/credentialprovider/config.yaml and the binary in
# /var/lib/rancher/credentialprovider/bin/; k3s passes both to the kubelet
# when they exist. Elsewhere, use --image-credential-provider-config and
# --image-credential-provider-bin-dir.
#
# apiVersion MUST be v1: tokenAttributes is rejected in v1beta1, and the
# kubelet then refuses to start.
apiVersion: kubelet.config.k8s.io/v1
kind: CredentialProviderConfig
providers:
  - name: gcp-wif-credential-provider
    apiVersion: credentialprovider.kubelet.k8s.io/v1
    matchImages:
      - "*-docker.pkg.dev"
    defaultCacheDuration: "50m"
    tokenAttributes:
      # The WIF provider's canonical name. GCP accepts it as the token
      # audience when the provider's allowed audiences are left empty.
      serviceAccountTokenAudience: "//iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER"
      # The credential depends on the token, so cache per token.
      cacheType: Token
      requireServiceAccount: true
      # A pod opts in through its ServiceAccount. Without the annotation the
      # plugin is not called at all, and a pull from *-docker.pkg.dev fails
      # rather than borrowing some other identity.
      requiredServiceAccountAnnotationKeys:
        - gcp-wif-credential-provider.dlouwers.github.io/workload-identity-provider
      optionalServiceAccountAnnotationKeys:
        - gcp-wif-credential-provider.dlouwers.github.io/service-account
